[project]
name = "mtl-analyst-agent"
version = "0.1.0"
description = "Analyst agent over Montréal open data: model-written SQL, code-enforced sandbox, code-verified numbers"
requires-python = ">=3.12"
dependencies = [
  "agent-framework==1.22.0",
  "duckdb==1.5.6",
  "sqlglot==30.23.0",
  "pydantic==2.14.1",
  "pyarrow>=18",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "azure-identity==1.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
